<style>

.hero{padding:2.5rem 3rem 2rem;position:relative}.hero::after{content:'';position:absolute;bottom:0;left:3rem;right:3rem;height:1px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}

.item.s-w{border-left-color:var(--watch);background:rgba(106,173,224,.03)}.item.s-d{opacity:.32;border-left-color:var(--gold)}.item.s-d .it{text-decoration:line-through;text-decoration-color:var(--faint)}

.mo-bg{display:none;position:fixed;inset:0;background:rgba(10,10,16,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:100;align-items:center;justify-content:center;padding:1rem}.mo-bg.open{display:flex}

</style>

let ST={},CI=[],CA={},AF='all',showSV=false;
const all=()=>[...B,...CI];
const gs=r=>ST[r]||{s:0,ep:0};
const fD=(m,e)=>{const h=Math.floor(m/60),r=m%60;return e?`${e}ep · ${h}h${r?r+'m':''}`:`${h}h${r}m`};
const fH=m=>m>1440?`${(m/1440).toFixed(1)}d`:`${Math.floor(m/60)}h${m%60}m`;
function mf(d){const s=gs(d.rank);if(AF==='all')return true;if(AF==='movie')return d.type==='movie';if(AF==='anime')return d.type==='anime';if(AF==='show')return d.type==='show';if(AF==='or')return d.or;if(AF==='watching')return s.s===1;if(AF==='done')return s.s===2;return true}
const tiers=[{l:'Under 2h',x:120},{l:'2–8 hours',x:480},{l:'8–20 hours',x:1200},{l:'20–50 hours',x:3000},{l:'50+ hours',x:1/0}];

function render(){
  const el=document.getElementById('list'),v=[...all()].sort((a,b)=>a.mins-b.mins).filter(mf);
  if(!v.length){el.innerHTML='<div style="padding:3rem;text-align:center;color:var(--muted);font-family:var(--serif);font-size:1rem">Nothing here.</div>';hud(v);return}
  let h='',n=1,dy=0;
  tiers.forEach((t,i)=>{const p=i?tiers[i-1].x:0,items=v.filter(d=>d.mins>p&&d.mins<=t.x);if(!items.length)return;
    h+=`<div class="tier"><div class="tier-h"><span class="tier-l">${t.l}</span><div class="tier-ln"></div></div>`;
    items.forEach(d=>{
      const s=gs(d.rank),dn=s.s===2,wt=s.s===1,sc=dn?' s-d':wt?' s-w':'',c=CA[d.rank]||{};
      const href=c.id?`https://www.imdb.com/title/${c.id}/`:`https://www.imdb.com/find/?q=${encodeURIComponent(d.title)}`;
      const tC=d.type==='movie'?'b-movie':d.type==='anime'?'b-anime':'b-show';
      const sC=d.custom?'badge b-cust':d.tag==='planned'?'badge b-plan':'badge b-src';
      const sL=d.custom?'Added':d.tag==='planned'?'Plan':d.tag==='or'?'OR':d.tag==='rec'?'Rec':'—';
      let extra='';
      if(d.or)extra+='<span class="badge b-or">OR</span>';
      if(c.status==='running')extra+='<span class="badge b-run">Running</span>';
      else if(c.status==='ended')extra+='<span class="badge b-end">Ended</span>';
      let epH='';if(wt&&d.eps)epH=`<span class="ep-t"><button class="epb" onclick="event.stopPropagation();W.epD(${d.rank})">−</button>${s.ep||0}/${d.eps}<button class="epb" onclick="event.stopPropagation();W.epI(${d.rank},${d.eps})">+</button></span>`;
      const editB=d.custom?`<button class="ebtn" onclick="event.stopPropagation();W.editC(${d.rank})">✏</button>`:'';
      const delB=d.custom?`<button class="xbtn" onclick="event.stopPropagation();W.delC(${d.rank})">✕</button>`:'';
      const stag=Math.min(dy*.02,.5);dy++;
      h+=`<div class="item${sc}" id="i-${d.rank}" style="animation-delay:${stag}s" onclick="W.tog(${d.rank},${!!d.eps})">
        <div class="inum">${n++}</div><div class="imain">
          <div class="ichk"><svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="var(--bg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="iinfo"><div class="it">${d.title}</div><div class="isub">${d.sub||''}${d.genre?' · '+d.genre:''}</div></div>
        </div><div class="imeta">${epH}${extra}<span class="${sC}">${sL}</span><span class="badge ${tC}">${d.type}</span><a class="imdb" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">IMDb↗</a>${editB}${delB}<span class="dur">${fD(d.mins,d.eps)}</span></div></div>`});h+='</div>'});
  el.innerHTML=h;hud(v)}

function hud(v){if(!v)v=[...all()].sort((a,b)=>a.mins-b.mins).filter(mf);
  const A=all(),dc=A.filter(d=>gs(d.rank).s===2),wc=A.filter(d=>gs(d.rank).s===1),rem=v.filter(d=>gs(d.rank).s!==2).reduce((a,b)=>a+b.mins,0);
  document.getElementById('sT').textContent=v.length;document.getElementById('sD').textContent=dc.length;
  document.getElementById('sW').textContent=wc.length;document.getElementById('sH').textContent=Math.round(rem/60).toLocaleString();
  document.getElementById('ft').textContent=fH(rem);
  const p=v.length?(v.filter(d=>gs(d.rank).s===2).length/v.length*100):0;
  document.getElementById('pf').style.width=p.toFixed(1)+'%';document.getElementById('ptx').textContent=`${v.filter(d=>gs(d.rank).s===2).length}/${v.length}`}

// Expose all handlers via single W object
const W={};window.W=W;
W.tog=(r,hasEps)=>{const s=gs(r);if(hasEps){if(s.s===0)ST[r]={s:1,ep:s.ep||1};else if(s.s===1)ST[r]={s:2,ep:s.ep};else delete ST[r]}else{if(s.s===0)ST[r]={s:2,ep:0};else delete ST[r]}save();render()};
W.epI=(r,mx)=>{const s=gs(r);s.ep=Math.min((s.ep||0)+1,mx);ST[r]=s;save();render()};
W.epD=r=>{const s=gs(r);s.ep=Math.max((s.ep||1)-1,0);ST[r]=s;save();render()};
W.fil=(f,btn)=>{AF=f;document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');if(showSV){showSV=false;document.getElementById('svw').classList.remove('on');document.getElementById('list').classList.remove('off')}render()};
W.delC=r=>{if(!confirm('Delete this item?'))return;CI=CI.filter(c=>c.rank!==r);delete ST[r];delete CA[r];save();render()};
W.rand=()=>{const v=[...all()].filter(mf).filter(d=>gs(d.rank).s===0);if(!v.length)return alert('No unwatched titles!');const p=v[Math.floor(Math.random()*v.length)];if(showSV){showSV=false;document.getElementById('svw').classList.remove('on');document.getElementById('list').classList.remove('off')}render();setTimeout(()=>{const e=document.getElementById('i-'+p.rank);if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.add('hl');setTimeout(()=>e.classList.remove('hl'),3500)}},100)};

// Stats
W.togSV=()=>{showSV=!showSV;document.getElementById('svw').classList.toggle('on',showSV);document.getElementById('list').classList.toggle('off',showSV);if(showSV)renderSV()};
function renderSV(){
  const A=all(),dn=A.filter(d=>gs(d.rank).s===2),wt=A.filter(d=>gs(d.rank).s===1),pl=A.filter(d=>gs(d.rank).s===0);
  const hD=Math.round(dn.reduce((a,b)=>a+b.mins,0)/60),pct=A.length?Math.round(dn.length/A.length*100):0;
  const ty={movie:0,anime:0,show:0};A.forEach(d=>ty[d.type]=(ty[d.type]||0)+1);const tM=Math.max(...Object.values(ty));
  const ge={};A.forEach(d=>(d.genre||'').split(/\s*\/\s*/).forEach(g=>{if(g)ge[g]=(ge[g]||0)+1}));
  const gS=Object.entries(ge).sort((a,b)=>b[1]-a[1]).slice(0,10),gM=gS.length?gS[0][1]:1;
  const tc={movie:'var(--movie)',anime:'var(--anime)',show:'var(--show)'};
  let h=`<div class="sv-grid"><div class="sv-c"><div class="sv-cn">${A.length}</div><div class="sv-cl">Total</div></div><div class="sv-c"><div class="sv-cn" style="color:var(--gold)">${dn.length}</div><div class="sv-cl">Done</div></div><div class="sv-c"><div class="sv-cn" style="color:var(--watch)">${wt.length}</div><div class="sv-cl">Watching</div></div><div class="sv-c"><div class="sv-cn">${hD.toLocaleString()}</div><div class="sv-cl">Hrs watched</div></div></div>
  <div class="sv-s"><div class="sv-t">Completion — ${pct}%</div><div class="sv-prog"><div class="sv-pf" style="width:${pct}%"></div></div></div>
  <div class="sv-s"><div class="sv-t">By type</div>`;
  ['movie','anime','show'].forEach(t=>h+=`<div class="bar-r"><div class="bar-l" style="color:${tc[t]}">${t[0].toUpperCase()+t.slice(1)}s</div><div class="bar-w"><div class="bar-f" style="width:${ty[t]/tM*100}%;background:${tc[t]}"></div></div><div class="bar-v">${ty[t]}</div></div>`);
  h+=`</div><div class="sv-s"><div class="sv-t">Top genres</div>`;
  gS.forEach(([g,c])=>h+=`<div class="bar-r"><div class="bar-l">${g}</div><div class="bar-w"><div class="bar-f" style="width:${c/gM*100}%;background:var(--gold2)"></div></div><div class="bar-v">${c}</div></div>`);
  h+=`</div><div class="sv-s"><div class="sv-t">Status</div>
  <div class="bar-r"><div class="bar-l" style="color:var(--faint)">Plan</div><div class="bar-w"><div class="bar-f" style="width:${pl.length/A.length*100}%;background:var(--faint)"></div></div><div class="bar-v">${pl.length}</div></div>
  <div class="bar-r"><div class="bar-l" style="color:var(--watch)">Watching</div><div class="bar-w"><div class="bar-f" style="width:${wt.length/A.length*100}%;background:var(--watch)"></div></div><div class="bar-v">${wt.length}</div></div>
  <div class="bar-r"><div class="bar-l" style="color:var(--gold)">Done</div><div class="bar-w"><div class="bar-f" style="width:${dn.length/A.length*100}%;background:var(--gold)"></div></div><div class="bar-v">${dn.length}</div></div></div>`;
  document.getElementById('svw').innerHTML=h}

// OMDB
let sT;W.dSearch=q=>{clearTimeout(sT);if(q.length<2){document.getElementById('sr').innerHTML='';return}sT=setTimeout(()=>oS(q),500)};
async function oS(q){try{const r=await fetch(`https://www.omdbapi.com/?apikey=${OK}&s=${encodeURIComponent(q)}`);const d=await r.json();if(d.Search){const sr=document.getElementById('sr');sr.innerHTML='';d.Search.slice(0,6).forEach(i=>{const div=document.createElement('div');div.className='sri';div.innerHTML=`<img class="srp" src="${i.Poster!=='N/A'?i.Poster:''}" alt="" onerror="this.style.background='var(--surface2)'"><div><div class="srt">${i.Title}</div><div class="srm">${i.Year} · ${i.Type}</div></div>`;div.onclick=()=>oSel(i.imdbID);sr.appendChild(div)})}}catch(e){}}
async function oSel(id){try{const r=await fetch(`https://www.omdbapi.com/?apikey=${OK}&i=${id}&plot=short`);const d=await r.json();
  document.getElementById('mTi').value=d.Title||'';document.getElementById('mGe').value=d.Genre||'';
  document.getElementById('mSu').value=[d.Year,d.Actors?d.Actors.split(',')[0]:''].filter(Boolean).join(' · ');
  document.getElementById('mImdb').value=d.imdbID||'';
  const isSer=d.Type==='series';document.getElementById('mTy').value=isSer?'show':'movie';W.tyC();
  document.getElementById('mMi').value=parseInt(d.Runtime)||0;
  document.getElementById('sr').innerHTML='';document.getElementById('mS').value=''}catch(e){}}

W.tyC=()=>{const s=document.getElementById('mTy').value!=='movie';document.getElementById('mEW').style.display=s?'block':'none';document.getElementById('mDL').textContent=s?'Ep runtime (min)':'Runtime (min)';document.getElementById('mDN').textContent=s?'Per episode':'Total runtime'};

W.openM=(editRank)=>{
  document.getElementById('mEdit').value=editRank||'';
  document.getElementById('mTitle').textContent=editRank?'Edit title':'Add a title';
  if(editRank){const d=[...all()].find(x=>x.rank===editRank);if(d){document.getElementById('mTi').value=d.title;document.getElementById('mTy').value=d.type;W.tyC();document.getElementById('mTg').value=d.tag||'personal';document.getElementById('mGe').value=d.genre||'';document.getElementById('mMi').value=d.eps?Math.round(d.mins/d.eps):d.mins;if(d.eps)document.getElementById('mEp').value=d.eps;document.getElementById('mSu').value=d.sub||'';const c=CA[d.rank];if(c&&c.id)document.getElementById('mImdb').value=c.id}}
  document.getElementById('modal').classList.add('open');document.getElementById(editRank?'mTi':'mS').focus()};
W.closeM=()=>{document.getElementById('modal').classList.remove('open');['mS','mTi','mGe','mSu','mMi','mEp'].forEach(id=>document.getElementById(id).value='');document.getElementById('mImdb').value='';document.getElementById('mEdit').value='';document.getElementById('sr').innerHTML=''};
W.editC=r=>W.openM(r);

W.submit=()=>{
  const editRank=parseInt(document.getElementById('mEdit').value)||null;
  const title=document.getElementById('mTi').value.trim(),type=document.getElementById('mTy').value,tag=document.getElementById('mTg').value,genre=document.getElementById('mGe').value.trim(),sub=document.getElementById('mSu').value.trim(),mR=parseInt(document.getElementById('mMi').value)||0,eps=parseInt(document.getElementById('mEp').value)||null,imdbID=document.getElementById('mImdb').value.trim();
  if(!title||!mR){alert('Title and runtime required.');return}
  const tot=(type!=='movie'&&eps)?mR*eps:mR;
  if(editRank){const idx=CI.findIndex(c=>c.rank===editRank);if(idx>=0){CI[idx]={...CI[idx],title,sub,type,genre,mins:tot,tag,or:tag==='or',...(eps?{eps}:{eps:undefined})};if(imdbID)CA[editRank]={...CA[editRank],id:imdbID}}}
  else{const mx=Math.max(...all().map(d=>d.rank),999);const ni={rank:mx+1,title,sub,type,genre,mins:tot,tag,or:tag==='or',custom:true,...(eps?{eps}:{})};CI.push(ni);if(imdbID)CA[ni.rank]={id:imdbID}}
  save();W.closeM();render()};

// Enrich
W.enrichAll=async()=>{const btn=document.getElementById('enrBtn');btn.textContent='⏳';btn.disabled=true;
  const items=all().filter(d=>!CA[d.rank]||!CA[d.rank].id);let done=0;
  for(const d of items){try{const r=await fetch(`https://www.omdbapi.com/?apikey=${OK}&t=${encodeURIComponent(d.title)}&type=${d.type==='anime'?'series':d.type==='show'?'series':'movie'}`);const j=await r.json();
    if(j.imdbID){const yr=j.Year||'';let status='';if(yr.includes('–')){status=yr.endsWith('–')||yr.endsWith('– ')?'running':'ended'}
    CA[d.rank]={id:j.imdbID,status};done++}
    if(done%10===0){await save();render()}}catch(e){}await new Promise(r=>setTimeout(r,250))}
  await save();render();btn.textContent='🔄';btn.disabled=false;alert(`Done! Enriched ${done} titles.`)};

(async()=>{const s=await load();ST=s.st;CI=s.cust;CA=s.ca;render()})();
</script>
