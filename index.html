let statuses={},customItems=[],cache={},activeFilter='all',showStats=false;
function all(){return[...B,...customItems]}
function gs(r){return statuses[r]||{s:0,ep:0}}
function fD(m,e){const h=Math.floor(m/60),r=m%60;return e?`${e} eps · ${h}h${r?r+'m':''}`:`${h}h ${r}m`}
function fH(m){return m>1440?`${(m/1440).toFixed(1)} days`:`${Math.floor(m/60)}h ${m%60}m`}
function mf(d){const st=gs(d.rank);if(activeFilter==='all')return true;if(activeFilter==='movie')return d.type==='movie';if(activeFilter==='anime')return d.type==='anime';if(activeFilter==='show')return d.type==='show';if(activeFilter==='or')return d.or===true;if(activeFilter==='planned')return d.tag==='planned';if(activeFilter==='rec')return d.tag==='rec';if(activeFilter==='watching')return st.s===1;if(activeFilter==='done')return st.s===2;if(activeFilter==='custom')return d.custom===true;return true}

const tiers=[{l:'Quick watch — under 2h',x:120},{l:'Short — 2–8 hours',x:480},{l:'Medium — 8–20 hours',x:1200},{l:'Long haul — 20–50 hours',x:3000},{l:'Marathon — 50+ hours',x:1/0}];

function render(){
  const el=document.getElementById('list'),v=[...all()].sort((a,b)=>a.mins-b.mins).filter(mf);
  if(!v.length){el.innerHTML='<div style="padding:4rem;text-align:center;color:var(--muted);font-family:var(--serif);font-size:1.1rem">Nothing here.</div>';stats(v);return}
  let h='',n=1,dy=0;
  tiers.forEach((t,ti)=>{const prev=ti?tiers[ti-1].x:0,items=v.filter(d=>d.mins>prev&&d.mins<=t.x);if(!items.length)return;
    h+=`<div class="tier"><div class="tier-h"><span class="tier-l">${t.l}</span><div class="tier-ln"></div></div>`;
    items.forEach(d=>{const st=gs(d.rank),done=st.s===2,watch=st.s===1,sClass=done?' s-done':watch?' s-watch':'';
      const orB=d.or?'<span class="badge b-or">OR/EM</span>':'';
      const frB=d.franchise?`<span class="badge b-franchise">${d.franchise}</span>`:'';
      const sC=d.custom?'badge b-cust':d.tag==='planned'?'badge b-plan':'badge b-src';
      const sL=d.custom?'My add':d.tag==='planned'?'Plan':d.tag==='or'?'OR':d.tag==='rec'?'Rec':'—';
      const tC=d.type==='movie'?'b-movie':d.type==='anime'?'b-anime':'b-show';
      const cData=cache[d.rank];
      const href=cData&&cData.id?`https://www.imdb.com/title/${cData.id}/`:`https://www.imdb.com/find/?q=${encodeURIComponent(d.title)}`;
      const del=d.custom?`<button class="del" onclick="event.stopPropagation();window.delC(${d.rank})">✕</button>`:'';
      let epHtml='';
      if(watch&&d.eps){epHtml=`<span class="ep-track"><button class="ep-btn" onclick="event.stopPropagation();window.epDec(${d.rank})">−</button><span>${st.ep||0}/${d.eps}</span><button class="ep-btn" onclick="event.stopPropagation();window.epInc(${d.rank},${d.eps})">+</button></span>`}
      const stag=Math.min(dy*0.025,0.6);dy++;
      h+=`<div class="item${sClass}" id="item-${d.rank}" style="animation-delay:${stag}s" onclick="window.tog(${d.rank},${!!d.eps})">
        <div class="inum">${n++}</div><div class="imain">
          <div class="ichk"><svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="#08080c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="iinfo"><div class="it">${d.title}</div><div class="isub">${d.sub||''}${d.genre?` · ${d.genre}`:''}</div></div>
        </div><div class="imeta">${epHtml}${frB}${orB}<span class="${sC}">${sL}</span><span class="badge ${tC}">${d.type}</span><a class="imdb" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">IMDb ↗</a>${del}<span class="dur">${fD(d.mins,d.eps)}</span></div></div>`
    });h+='</div>'});
  el.innerHTML=h;stats(v);
}

function stats(v){if(!v)v=[...all()].sort((a,b)=>a.mins-b.mins).filter(mf);
  const allD=all(),doneC=allD.filter(d=>gs(d.rank).s===2),watchC=allD.filter(d=>gs(d.rank).s===1);
  const rem=v.filter(d=>gs(d.rank).s!==2).reduce((a,b)=>a+b.mins,0);
  const doneHrs=Math.round(doneC.reduce((a,b)=>a+b.mins,0)/60);
  document.getElementById('s-t').textContent=v.length;
  document.getElementById('s-d').textContent=doneC.length;
  document.getElementById('s-w').textContent=watchC.length;
  document.getElementById('s-h').textContent=Math.round(rem/60).toLocaleString();
  document.getElementById('ft').textContent=fH(rem);
  const p=v.length?(v.filter(d=>gs(d.rank).s===2).length/v.length*100):0;
  document.getElementById('pf').style.width=p.toFixed(1)+'%';
  document.getElementById('ptx').textContent=`${v.filter(d=>gs(d.rank).s===2).length}/${v.length}`;
}

// ── Status cycling ──────────────────────────────────────
window.tog=function(r,hasEps){
  const st=gs(r);
  if(hasEps){if(st.s===0)statuses[r]={s:1,ep:st.ep||1};else if(st.s===1)statuses[r]={s:2,ep:st.ep};else delete statuses[r]}
  else{if(st.s===0)statuses[r]={s:2,ep:0};else delete statuses[r]}
  saveFB();render()};
window.epInc=function(r,max){const st=gs(r);st.ep=Math.min((st.ep||0)+1,max);statuses[r]=st;saveFB();render()};
window.epDec=function(r){const st=gs(r);st.ep=Math.max((st.ep||1)-1,0);statuses[r]=st;saveFB();render()};
window.fil=function(f,btn){activeFilter=f;document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');if(showStats){showStats=false;document.getElementById('statsView').classList.remove('on');document.getElementById('list').classList.remove('off')}render()};
window.delC=function(r){customItems=customItems.filter(c=>c.rank!==r);delete statuses[r];saveFB();render()};

// ── Random picker ───────────────────────────────────────
window.randomPick=function(){
  const v=[...all()].filter(mf).filter(d=>gs(d.rank).s===0);
  if(!v.length){alert('No unwatched titles in current filter!');return}
  const pick=v[Math.floor(Math.random()*v.length)];
  if(showStats){showStats=false;document.getElementById('statsView').classList.remove('on');document.getElementById('list').classList.remove('off')}
  render();
  setTimeout(()=>{const el=document.getElementById('item-'+pick.rank);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('highlight');setTimeout(()=>el.classList.remove('highlight'),3500)}},100)};

window.toggleStats=function(){
  showStats=!showStats;
  document.getElementById('statsView').classList.toggle('on',showStats);
  document.getElementById('list').classList.toggle('off',showStats);
  if(showStats)renderStats()};

function renderStats(){
  const A=all(),done=A.filter(d=>gs(d.rank).s===2),watch=A.filter(d=>gs(d.rank).s===1),plan=A.filter(d=>gs(d.rank).s===0);
  const hDone=Math.round(done.reduce((a,b)=>a+b.mins,0)/60),hRem=Math.round(plan.concat(watch).reduce((a,b)=>a+b.mins,0)/60);
  const pct=A.length?Math.round(done.length/A.length*100):0;
  const types={movie:0,anime:0,show:0};A.forEach(d=>types[d.type]=(types[d.type]||0)+1);
  const tMax=Math.max(...Object.values(types));
  const genres={};A.forEach(d=>{(d.genre||'').split(' / ').forEach(g=>{g=g.trim();if(g)genres[g]=(genres[g]||0)+1})});
  const gSorted=Object.entries(genres).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const gMax=gSorted.length?gSorted[0][1]:1;
  const colors={movie:'var(--movie)',anime:'var(--anime)',show:'var(--show)'};
  let h=`<div class="sv-grid">
    <div class="sv-card"><div class="sv-card-n">${A.length}</div><div class="sv-card-l">Total titles</div></div>
    <div class="sv-card"><div class="sv-card-n" style="color:var(--gold)">${done.length}</div><div class="sv-card-l">Completed</div></div>
    <div class="sv-card"><div class="sv-card-n" style="color:var(--watch)">${watch.length}</div><div class="sv-card-l">Watching</div></div>
    <div class="sv-card"><div class="sv-card-n">${hDone.toLocaleString()}</div><div class="sv-card-l">Hours watched</div></div>
  </div>
  <div class="sv-section"><div class="sv-title">Completion — ${pct}%</div><div class="sv-progress"><div class="sv-progress-fill" style="width:${pct}%"></div></div></div>
  <div class="sv-section"><div class="sv-title">By type</div>`;
  ['movie','anime','show'].forEach(t=>{h+=`<div class="bar-row"><div class="bar-label" style="color:${colors[t]}">${t.charAt(0).toUpperCase()+t.slice(1)}s</div><div class="bar-wrap"><div class="bar-fill" style="width:${types[t]/tMax*100}%;background:${colors[t]}"></div></div><div class="bar-val">${types[t]}</div></div>`});
  h+=`</div><div class="sv-section"><div class="sv-title">Top genres</div>`;
  gSorted.forEach(([g,c])=>{h+=`<div class="bar-row"><div class="bar-label">${g}</div><div class="bar-wrap"><div class="bar-fill" style="width:${c/gMax*100}%;background:var(--gold2)"></div></div><div class="bar-val">${c}</div></div>`});
  h+=`</div><div class="sv-section"><div class="sv-title">Status breakdown</div>
    <div class="bar-row"><div class="bar-label" style="color:var(--faint)">Plan to watch</div><div class="bar-wrap"><div class="bar-fill" style="width:${plan.length/A.length*100}%;background:var(--faint)"></div></div><div class="bar-val">${plan.length}</div></div>
    <div class="bar-row"><div class="bar-label" style="color:var(--watch)">Watching</div><div class="bar-wrap"><div class="bar-fill" style="width:${watch.length/A.length*100}%;background:var(--watch)"></div></div><div class="bar-val">${watch.length}</div></div>
    <div class="bar-row"><div class="bar-label" style="color:var(--gold)">Completed</div><div class="bar-wrap"><div class="bar-fill" style="width:${done.length/A.length*100}%;background:var(--gold)"></div></div><div class="bar-val">${done.length}</div></div></div>`;
  document.getElementById('statsView').innerHTML=h}

let searchTimer;
window.debounceSearch=function(q){clearTimeout(searchTimer);if(q.length<2){document.getElementById('sr').innerHTML='';return}searchTimer=setTimeout(()=>omdbSearch(q),500)};
async function omdbSearch(q){
  try{const r=await fetch(`https://www.omdbapi.com/?apikey=${OMDB}&s=${encodeURIComponent(q)}`);const d=await r.json();
    if(d.Search){const sr=document.getElementById('sr');sr.innerHTML='';d.Search.slice(0,6).forEach(i=>{
      const div=document.createElement('div');div.className='sr-item';
      div.innerHTML=`<img class="sr-poster" src="${i.Poster!=='N/A'?i.Poster:''}" alt="" onerror="this.style.background='var(--surface2)'"><div class="sr-info"><div class="sr-title">${i.Title}</div><div class="sr-meta">${i.Year} · ${i.Type}</div></div>`;
      div.onclick=()=>omdbSelect(i.imdbID);sr.appendChild(div)})
  }}catch(e){console.error(e)}}

async function omdbSelect(id){
  try{const r=await fetch(`https://www.omdbapi.com/?apikey=${OMDB}&i=${id}&plot=short`);const d=await r.json();
    document.getElementById('m-title').value=d.Title||'';
    document.getElementById('m-genre').value=d.Genre||'';
    document.getElementById('m-sub').value=[d.Year,d.Actors?d.Actors.split(',')[0]:''].filter(Boolean).join(' · ');
    document.getElementById('m-imdb').value=d.imdbID||'';
    const isSeries=d.Type==='series';
    document.getElementById('m-type').value=isSeries?'show':'movie';window.typeChanged();
    if(isSeries){const rt=parseInt(d.Runtime)||24;document.getElementById('m-mins').value=rt}
    else{document.getElementById('m-mins').value=parseInt(d.Runtime)||0}
    document.getElementById('sr').innerHTML='';document.getElementById('m-search').value='';
  }catch(e){console.error(e)}}

window.typeChanged=function(){const s=document.getElementById('m-type').value!=='movie';document.getElementById('m-ew').style.display=s?'block':'none';document.getElementById('m-dl').textContent=s?'Ep runtime (min)':'Runtime (min)';document.getElementById('m-dn').textContent=s?'Per episode':'Total runtime'};

window.submitAdd=function(){
  const title=document.getElementById('m-title').value.trim(),type=document.getElementById('m-type').value,tag=document.getElementById('m-tag').value,genre=document.getElementById('m-genre').value.trim(),sub=document.getElementById('m-sub').value.trim(),mR=parseInt(document.getElementById('m-mins').value)||0,eps=parseInt(document.getElementById('m-eps').value)||null,imdbID=document.getElementById('m-imdb').value.trim();
  if(!title||!mR){alert('Title and runtime required.');return}
  const tot=(type!=='movie'&&eps)?mR*eps:mR;const mx=Math.max(...all().map(d=>d.rank),999);
  const ni={rank:mx+1,title,sub,type,genre,mins:tot,tag,or:tag==='or',custom:true,...(eps?{eps}:{})};
  customItems.push(ni);
  if(imdbID)cache[ni.rank]={id:imdbID};
  saveFB();window.closeModal();render()};

// ── Enrich existing items ───────────────────────────────
window.enrichAll=async function(){
  const btn=document.getElementById('enrich-btn');btn.textContent='⏳';btn.disabled=true;
  const items=all().filter(d=>!cache[d.rank]);let done=0;
  for(const d of items){
    try{const r=await fetch(`https://www.omdbapi.com/?apikey=${OMDB}&t=${encodeURIComponent(d.title)}&type=${d.type==='anime'?'series':d.type==='show'?'series':'movie'}`);const j=await r.json();
      if(j.imdbID)cache[d.rank]={id:j.imdbID};done++;
      if(done%10===0){await saveFB();render()}
    }catch(e){console.error(d.title,e)}
    await new Promise(r=>setTimeout(r,200));}
  await saveFB();render();btn.textContent='🔄';btn.disabled=false;alert(`Enriched ${done} titles with correct IMDB links.`)};

// ── Boot ────────────────────────────────────────────────
(async()=>{const s=await loadFB();statuses=s.st;customItems=s.custom;cache=s.cache;render()})();
</script>
